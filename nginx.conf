# nginx für das Image (Dockerfile → /etc/nginx/conf.d/default.conf), nur der server-Block.
# Der Service Worker (sw.js) arbeitet network-first und legt seine Hülle mit `cache: 'reload'` an; trotzdem darf
# der Browser den Worker selbst und die Seiten nie aus dem HTTP-Cache bedienen, sonst käme ein Update zu spät an.
# Dateien tragen `?v=<Version>`, sind aber nicht fingerabdruck-benannt: darum no-cache (Rückfrage per ETag, 304).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Kein SPA-Fallback: unbekannte Pfade sind 404 (login.html und print.html sind eigene Seiten).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Service Worker: nie aus dem HTTP-Cache (Update-Prüfung des Browsers).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Schriften ändern sich praktisch nie: eine Woche, ohne Rückfrage.
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Für den Health-Check von Coolify/Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Versteckte Dateien nie ausliefern.
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;
}
